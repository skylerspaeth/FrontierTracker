<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoWild Tracker</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="GoWild">
<meta name="theme-color" content="#0d0d0e">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0d0d0e; --panel:#161617; --panel2:#1f1f21; --ink:#ececee; --muted:#a0a0a6; --line:#2c2c2f;
  --green:#4ade80; --green-soft:rgba(74,222,128,.14); --amber:#fbbf24; --amber-soft:rgba(251,191,36,.14);
  --red:#f87171; --gray:#808086; --accent:#4ade80; --btn:#148046; --btn-hover:#18974f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.app{display:grid;grid-template-columns:minmax(340px,450px) minmax(0,1fr);height:100vh;height:100dvh}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;overflow-x:hidden}
#map{height:100%;width:100%;background:var(--bg)}
header{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12px}
.controls{padding:12px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:10px;flex:none;max-height:60%;overflow-y:auto}
.controls>*{min-width:0}
label.small{display:block;margin-bottom:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
select,input[type=text]{width:100%;max-width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--panel2);color:var(--ink)}
select:focus,input[type=text]:focus,button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
input::placeholder{color:var(--gray)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 9px;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.day b{display:block;font-size:13px}
.day span{font-size:11px;color:var(--muted)}
.day.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--green-soft)}
.day .pk{font-style:normal;font-weight:600;color:var(--amber)}
.day.peak:not(.on){border-color:rgba(251,191,36,.45)}
.row{display:flex;gap:8px;align-items:center;min-width:0}
button.primary{flex:1;min-width:0;background:var(--btn);color:#fff;border:0;border-radius:8px;padding:9px 12px;font:inherit;font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.primary:hover:not(:disabled){background:var(--btn-hover)}
button.primary:disabled{opacity:.6;cursor:default}
button.ghost{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer;color:var(--ink)}
button.ghost:hover{background:#2a2a2d}
button.back{display:inline-flex;align-items:center;gap:10px}
kbd{padding:1px 5px;border:1px solid #505056;border-bottom-width:2px;border-radius:4px;background:var(--panel);color:var(--muted);font:600 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
@media (hover:none) and (pointer:coarse){ kbd{display:none} }  /* touch screens: no Esc key to hint at */
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input[type=checkbox]{accent-color:var(--btn);margin:0}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress+.note{margin-top:8px}
#daynote>*+*{margin-top:8px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.note{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.warn{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:8px 10px;font-size:12px}
.filters{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.list{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0}
.stat{padding:10px 18px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.stat b{color:var(--ink)}
.stat .sub{margin-top:4px}
.stale{color:var(--amber);font-weight:600}
.foot{padding:14px 18px 18px;text-align:center;font-size:10.5px;color:var(--gray)}
.dest{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.dest:hover{background:var(--panel2)}
.dest>*{min-width:0}
.dest .name{font-weight:600;overflow-wrap:anywhere}
.dest .meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.price{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.price.open{color:var(--green)}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:999px;background:var(--line);color:var(--muted);margin-left:4px;font-weight:600}
.badge.seats{background:var(--amber-soft);color:var(--amber)}
.badge.non{background:var(--green-soft);color:var(--green)}
.dest.none .name,.dest.none .price{color:var(--gray);font-weight:500}
.detail{padding:14px 18px;display:none}
.detail h2{margin:13.6px 0 3.4px;font-size:17px;overflow-wrap:anywhere}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td.num .badge{display:inline-block;margin:2px 0 0;padding:2px 8px;white-space:nowrap;text-align:center;line-height:1.3}
tr.closed td{color:var(--gray)}
.track{font-size:11px;color:var(--muted)}
a{color:var(--green)}
a.book{display:inline-block;background:var(--btn);color:#fff;text-decoration:none;font-weight:600;font-size:12px;padding:4px 9px;border-radius:6px;white-space:nowrap}
a.book:hover{background:var(--btn-hover)}
.section{margin-top:16px}
.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 4px}
.legend{position:absolute;bottom:26px;right:12px;z-index:500;background:rgba(22,22,23,.92);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.5);max-width:calc(100% - 24px)}
.legend div{display:flex;align-items:center;gap:6px;margin:2px 0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.mapwrap{position:relative;min-height:0;min-width:0}
.pricetag{background:var(--green);color:#04170b;font-weight:700;font-size:11px;padding:1px 5px;border-radius:6px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.6)}
.pricetag.sel{background:#38bdf8;color:#04131c}

/* Leaflet dark skin */
.leaflet-container{background:var(--bg);font-family:inherit}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:0 2px 8px rgba(0,0,0,.5)!important}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--panel);color:var(--ink);border-bottom:1px solid var(--line)}
.leaflet-bar a:hover{background:var(--panel2)}
.leaflet-bar a.leaflet-disabled{background:var(--panel);color:var(--gray)}
.leaflet-control-attribution{background:rgba(22,22,23,.8)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--green)!important}
.leaflet-tooltip.plain{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.6);font:12px system-ui,sans-serif}
.leaflet-tooltip-top.plain:before{border-top-color:var(--line)}
.leaflet-tooltip-bottom.plain:before{border-bottom-color:var(--line)}
.leaflet-tooltip-left.plain:before{border-left-color:var(--line)}
.leaflet-tooltip-right.plain:before{border-right-color:var(--line)}

@media (max-width:1100px){
  .app{grid-template-columns:minmax(315px,385px) minmax(0,1fr)}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,38fr) minmax(0,62fr)}
  aside{order:2;border-right:0;border-top:1px solid var(--line)}
  .mapwrap{order:1}
  aside{overflow-y:auto}  /* whole panel scrolls as one on phones */
  .controls{max-height:none;overflow:visible}
  .list{flex:none;overflow:visible}
  header,.controls,.stat,.dest,.detail{padding-left:14px;padding-right:14px}
  select,input[type=text]{font-size:16px}  /* stop iOS zoom-on-focus */
  .legend{bottom:22px;right:8px;padding:6px 8px;font-size:11px}
}
@media (max-width:420px){
  h1{font-size:16px}
  .day{padding:5px 8px}
}
@media (max-height:520px) and (min-width:821px){
  .controls{max-height:50%}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>GoWild Tracker</h1>
      <div class="sub" id="fresh">Live from flyfrontier.com</div>
    </header>
    <div class="controls">
      <div>
        <label class="small" for="origin">From</label>
        <select id="origin"></select>
      </div>
      <div>
        <label class="small">Date</label>
        <div class="days" id="days"></div>
      </div>
      <div class="row">
        <button class="primary" id="scan">Check flights</button>
      </div>
      <div id="jobbox" style="display:none">
        <div class="progress"><i id="bar"></i></div>
        <div class="note" id="jobtext"></div>
      </div>
      <div id="daynote"></div>
      <div class="filters">
        <label class="toggle"><input type="checkbox" id="nonstop"> Nonstop only</label>
        <label class="toggle"><input type="checkbox" id="openonly" checked> GoWild only</label>
        <label class="toggle">Max $<input type="text" id="maxp" placeholder="any" style="width:64px;padding:3px 6px"></label>
      </div>
    </div>
    <div class="stat" id="stat">Pick an airport and a date, then Check flights.</div>
    <div class="list" id="list"></div>
    <div class="list detail" id="detail"></div>
  </aside>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="legend">
      <div><span class="dot" style="background:var(--green)"></span>GoWild seats open</div>
      <div><span class="dot" style="background:#55555a"></span><span id="legendnone">Checked, none open</span></div>
      <div><span class="dot" style="border:2px solid #8a8a90;width:9px;height:9px"></span>Route not checked yet</div>
    </div>
  </div>
</div>
<script src="/departed.js"></script>
<script>
const $ = s => document.querySelector(s);
const state = {meta:null, stations:{}, origin:null, day:null, results:null, selected:null, jobId:null, layers:[]};
const fmtMoney = v => v==null ? "" : "$" + v.toFixed(2);
const fmtTime = iso => new Date(iso).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
const fmtDay = iso => new Date(iso + "T12:00:00").toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"});
const fmtStamp = iso => {
  if(!iso) return "";
  const d = new Date(iso), now = new Date();
  const t = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  return d.toDateString() === now.toDateString() ? t : d.toLocaleDateString([], {month:"short", day:"numeric"}) + " " + t;
};
const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min ago" : Math.round(m/60) + " h ago"; };
// data older than half the auto-scan interval (same default/minimum as the server's watcher) counts as stale
const staleMs = () => Math.max(30, +(state.meta?.watch?.interval_minutes) || 120) * 30000;
const isStale = iso => Date.now() - new Date(iso) > staleMs();
// "peak day" when the date came from Frontier's own list; "possible peak day" when we only have a built-in/old copy
const peakWord = () => state.meta?.peak_reliable === false ? "possible peak day" : "peak day";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const map = L.map("map", {zoomControl:true, worldCopyJump:true}).setView([30, -95], 4);
new ResizeObserver(() => map.invalidateSize()).observe($("#map"));
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
L.tileLayer(ESRI + "World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  attribution: "Tiles &copy; Esri &mdash; Esri, HERE, Garmin, OpenStreetMap contributors", maxZoom: 16}).addTo(map);
L.tileLayer(ESRI + "World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {maxZoom: 16}).addTo(map);
const layer = L.layerGroup().addTo(map);

async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function frontierUrl(o, d, day){
  const dd = new Date(day + "T12:00:00").toLocaleDateString("en-US", {month:"short", day:"2-digit", year:"numeric"});
  return "https://booking.flyfrontier.com/Flight/InternalSelect?" + new URLSearchParams({o1:o, d1:d, dd1:dd, ADT:1, mon:"true", promo:""});
}

async function init(){
  state.meta = await api("/api/meta");
  for(const s of state.meta.stations) state.stations[s.code] = s;
  const sel = $("#origin");
  const groups = {};
  // airports with no routes (none sold, or only reachable on a partner airline) have nothing to pick
  const origins = state.meta.stations.filter(s => s.routes.length);
  const isOrigin = c => !!state.stations[c]?.routes.length;
  const mine = state.meta.watch.origins.filter(isOrigin);
  if(mine.length){
    const og = document.createElement("optgroup"); og.label = "Tracked airports";
    for(const c of mine){ const s = state.stations[c]; const o = document.createElement("option"); o.value = c; o.textContent = s.label + (s.state ? ", " + s.state : ""); og.appendChild(o); }
    sel.appendChild(og);
  }
  for(const s of origins){ if(!mine.includes(s.code)) (groups[s.countryName] ||= []).push(s); }
  const order = Object.keys(groups).sort((a,b) => (b.startsWith("United States")) - (a.startsWith("United States")) || a.localeCompare(b));
  for(const g of order){
    const og = document.createElement("optgroup"); og.label = g;
    for(const s of groups[g]){ const o = document.createElement("option"); o.value = s.code; o.textContent = s.label + (s.state ? ", " + s.state : ""); og.appendChild(o); }
    sel.appendChild(og);
  }
  const saved = (() => { try { return localStorage.getItem("gw.origin"); } catch(e) { return null; } })();
  state.origin = saved && isOrigin(saved) ? saved : (mine[0] || "DEN");
  sel.value = state.origin;
  state.day = state.meta.days[1].date;  // tomorrow
  $("#fresh").textContent = "Live from flyfrontier.com · route list updated " + fmtStamp(state.meta.markets_fetched_at);
  renderDays();
  sel.onchange = () => { state.origin = sel.value; try{localStorage.setItem("gw.origin", sel.value);}catch(e){}; state.selected = null; load(); };
  $("#scan").onclick = scan;
  for(const id of ["#nonstop", "#openonly"]) $(id).onchange = render;
  $("#maxp").oninput = render;
  await load();
  pollJobs();
}

function renderDays(){
  const box = $("#days"); box.innerHTML = "";
  for(const d of state.meta.days){
    const b = document.createElement("button");
    b.className = "day" + (d.date === state.day ? " on" : "") + (d.peak ? " peak" : "");
    const tag = d.domestic_open ? (d.ahead === 0 ? "today" : "tomorrow") : "early booking";
    b.title = d.domestic_open ? "" : "Outside the normal domestic window (the day before departure): domestic GoWild fares here are early-booking fares, which cost extra.\n\nInternational routes are inside their normal 10-day window.";
    b.innerHTML = `<b>${fmtDay(d.date)}</b><span>${tag}${d.peak ? ` · <em class="pk">${peakWord()}</em>` : ""}</span>`;
    b.onclick = () => { state.day = d.date; state.selected = null; renderDays(); load(); };
    box.appendChild(b);
  }
}

async function load(){
  state.results = await api(`/api/results?origin=${state.origin}&day=${state.day}`);
  render();
}

function destSummary(code){
  const r = state.results.results[code];
  // a route Frontier's calendar says doesn't fly that day isn't "checked", whatever an old scan stored
  if(!r || state.results.skipped[code]) return {code, checked:false};
  const nonstopOnly = $("#nonstop").checked;
  const maxp = parseFloat($("#maxp").value);
  const live = upcoming(r.flights);
  let open = live.filter(f => f.gowild);
  if(nonstopOnly) open = open.filter(f => f.stops === 0);
  if(!isNaN(maxp)) open = open.filter(f => f.gowild_price <= maxp);
  const min = open.length ? Math.min(...open.map(f => f.gowild_price)) : null;
  const seats = open.map(f => f.gowild_seats).filter(x => x != null);
  return {code, checked:true, r, nFlights: live.length, open, anyOpen: live.some(f => f.gowild), min, hasNonstop: open.some(f => f.stops === 0),
          fewSeats: seats.length ? Math.min(...seats) : null, status: r.status, error: r.last_error};
}

function render(){
  const res = state.results; if(!res) return;
  const o = state.stations[state.origin];
  const dayInfo = state.meta.days.find(d => d.date === state.day);
  // date note
  let note = "";
  if(state.meta.peak_reliable === false) note += `<div class="warn">Couldn't read Frontier's peak-day list, so peak days shown come from a built-in copy and may be out of date.</div>`;
  if(res.peak) note += `<div class="warn">${fmtDay(state.day)} is ${state.meta.peak_reliable === false ? "possibly" : ""} a peak day. GoWild seats can still be booked, but Frontier adds a peak-day charge, which is already included in the prices shown.</div>`;
  if(dayInfo && !dayInfo.domestic_open) note += `<div class="note">Domestic GoWild opens the day before departure. Domestic fares shown for ${fmtDay(state.day)} are <b>early-booking</b> fares, which carry an extra charge, so they cost more than usual. International routes are inside their normal 10-day window.</div>`;
  $("#daynote").innerHTML = note;
  // routes Frontier no longer flies at all (empty calendar) aren't destinations: leave them out
  const unserved = new Set(res.unserved || []);
  const routes = res.routes.filter(c => !unserved.has(c));
  const toCheck = routes.length - Object.keys(res.skipped).filter(c => !unserved.has(c)).length;
  $("#scan").textContent = `Check ${toCheck} route${toCheck === 1 ? "" : "s"} from ${state.origin}`;

  const sums = routes.map(destSummary);
  const checked = sums.filter(s => s.checked);
  const open = sums.filter(s => s.open && s.open.length);
  const last = checked.map(s => s.r.checked_at).sort().pop();
  // why each route has (or lacks) results, so the summary can say exactly what's going on
  const why = {notOperated:0, unscanned:0, unscannedEarly:0, errored:0, noFlights:0, noSeats:0, filtered:0, seats:0};
  const isIntl = c => state.stations[c]?.domestic === false;
  const earlyDay = dayInfo && !dayInfo.domestic_open;   // domestic GoWild opens the day before departure; the auto-scan only covers that
  const intlRoutes = routes.filter(isIntl);
  for(const s of sums){
    if(res.skipped[s.code]) why.notOperated++;
    else if(!s.checked) why[earlyDay && !isIntl(s.code) ? "unscannedEarly" : "unscanned"]++;
    else if(s.status === "error") why.errored++;
    else if(s.status === "no_service") why.noFlights++;
    else if(s.open.length) why.seats++;
    else if(s.anyOpen) why.filtered++;
    else why.noSeats++;
  }
  const n = (k, one, many) => `${k} ${k === 1 ? one : many}`;
  const reasons = [];
  if(why.notOperated) reasons.push(`${n(why.notOperated, "route", "routes")} not flown this day`);
  if(intlRoutes.length && intlRoutes.every(c => res.skipped[c])) reasons.push(`No international flights from ${state.origin} this day`);
  if(why.unscannedEarly) reasons.push(`${n(why.unscannedEarly, "domestic route", "domestic routes")} not auto-scanned this far out. Domestic GoWild opens the day before departure; <b>Check</b> shows early-booking fares`);
  if(why.unscanned) reasons.push(`${n(why.unscanned, "route", "routes")} not scanned yet`);
  if(why.errored) reasons.push(`${n(why.errored, "route", "routes")} failed to load from Frontier`);
  if(why.noFlights) reasons.push(`${n(why.noFlights, "route", "routes")} returned no flights`);
  if(why.noSeats) reasons.push(`${n(why.noSeats, "route", "routes")} with flights but no GoWild seats open`);
  if(why.filtered) reasons.push(`${n(why.filtered, "route", "routes")} with GoWild seats hidden by your filters`);
  const day = fmtDay(state.day);
  const why_ = reasons.map(r => `<div class="sub">${r}</div>`).join("");
  let head;
  if(checked.length){
    head = `<b>${open.length}</b> of ${checked.length} scanned destinations have GoWild seats on <b>${day}</b>` + (last ? ` · scanned ${ago(last)}` + (isStale(last) ? ` · <a href="#" class="stale" onclick="event.preventDefault();if(!$('#scan').disabled)scan()">stale, click to refresh</a>` : "") : "");
  } else if(why.unscanned || why.unscannedEarly){
    const k = why.unscanned + why.unscannedEarly;
    const todo = sums.filter(s => !res.skipped[s.code] && !s.checked);
    const kind = todo.every(s => !isIntl(s.code)) ? "Domestic routes" : todo.every(s => isIntl(s.code)) ? "International routes" : "Routes";
    head = `${kind} not scanned yet for ${day}. Hit <b>Check</b> to search ${n(k, "route", "routes")}.`;
  } else if(why.notOperated === routes.length){
    head = `No flights to scan on ${day}.`;
  } else {
    head = `Nothing to show for ${day}.`;
  }
  $("#stat").innerHTML = head + why_;

  // list
  const showAll = !$("#openonly").checked;
  const rows = sums.filter(s => showAll ? true : s.open && s.open.length)
    .sort((a,b) => (b.open?.length ? 1 : 0) - (a.open?.length ? 1 : 0) || (a.min ?? 1e9) - (b.min ?? 1e9) || a.code.localeCompare(b.code));
  const list = $("#list"); list.innerHTML = "";
  for(const s of rows){
    const st = state.stations[s.code] || {label: s.code};
    const div = document.createElement("div");
    const isOpen = s.open && s.open.length;
    div.className = "dest" + (isOpen ? "" : " none");
    let meta, price;
    if(!s.checked){ meta = res.skipped[s.code] ? res.skipped[s.code] : "not checked yet"; price = ""; }
    else if(s.status === "no_service"){ meta = res.skipped[s.code] || "no Frontier flights this day"; price = "—"; }
    else if(s.status === "error"){ meta = "couldn't read Frontier: " + esc(s.error?.error || ""); price = "?"; }
    else if(isOpen){
      meta = `${s.open.length} GoWild flight${s.open.length>1?"s":""}` + (s.hasNonstop ? `<span class="badge non">nonstop</span>` : "") +
        (s.fewSeats != null ? `<span class="badge seats">${s.fewSeats} seat${s.fewSeats>1?"s":""} left</span>` : "");
      price = fmtMoney(s.min);
    } else if(s.anyOpen){ meta = "GoWild seats hidden by your filters"; price = "—"; }
    else { meta = `${s.nFlights} flight${s.nFlights===1?"":"s"}, no GoWild seats`; price = "none"; }
    div.innerHTML = `<div class="name">${esc(st.label)}</div><div class="price ${isOpen?"open":""}">${price}</div><div class="meta">${meta}</div><div></div>`;
    div.onclick = () => select(s.code);
    list.appendChild(div);
  }
  if(rows.length) list.insertAdjacentHTML("beforeend", `<div class="foot">Showing all ${rows.length} destination${rows.length===1?"":"s"} currently available.</div>`);
  if(!rows.length && checked.length) list.innerHTML = `<div class="stat">No destinations match. Untick "GoWild only" to see everything.</div>`;

  state.sums = sums;
  drawMap(o, sums);
  if(state.selected) showDetail(state.selected);
}

const SEL = "#38bdf8";   // selected destination (matches .pricetag.sel)
const redrawMap = () => drawMap(state.stations[state.origin], state.sums || []);

function drawMap(o, sums){
  layer.clearLayers();
  const filtering = $("#nonstop").checked || !isNaN(parseFloat($("#maxp").value));
  $("#legendnone").textContent = filtering ? "Checked, none match filters" : "Checked, none open";
  if(!o) return;
  const pts = [[o.lat, o.lon]];
  // the selected destination is drawn last so its line and pin sit on top of the others
  const isSel = s => s.code === state.selected;
  for(const s of [...sums].sort((a,b) => isSel(a) - isSel(b))){
    const st = state.stations[s.code]; if(!st) continue;
    const isOpen = s.open && s.open.length;
    const sel = isSel(s);
    pts.push([st.lat, st.lon]);
    // grey means we know the answer: a successful scan, or no flights that day. A failed scan doesn't count.
    const skip = state.results.skipped[s.code];
    const known = s.checked ? s.status !== "error" : !!skip && skip !== "date has passed";
    // a selected destination gets a leg line even with no GoWild seats open
    if(isOpen || sel) L.polyline([[o.lat,o.lon],[st.lat,st.lon]], sel
      ? {color:SEL, weight:3.5, opacity:1}
      : {color:"#4ade80", weight:1.5, opacity:.5}).addTo(layer);
    const m = L.circleMarker([st.lat, st.lon], sel
      ? {radius:9, color:"#ffffff", weight:2.5, fillColor:SEL, fillOpacity:1}
      : isOpen
      ? {radius:7, color:"#0d0d0e", weight:2, fillColor:"#4ade80", fillOpacity:1}
      : known ? {radius:4, color:"#55555a", weight:1, fillColor:"#55555a", fillOpacity:1}
                  : {radius:4, color:"#8a8a90", weight:1.5, fillColor:"#0d0d0e", fillOpacity:1}).addTo(layer);
    const tip = isOpen ? `<b>${esc(st.label)}</b><br>GoWild from ${fmtMoney(s.min)} · ${s.open.length} flight${s.open.length>1?"s":""}`
      : `<b>${esc(st.label)}</b><br>${!s.checked ? esc(state.results.skipped[s.code] || "not checked")
          : s.status === "error" ? "scan failed" : s.status === "no_service" ? "no flights this day"
          : s.anyOpen ? "GoWild seats hidden by your filters" : "no GoWild seats"}`;
    m.bindTooltip(tip, {className:"plain"});
    m.on("click", () => select(s.code));
    if(isOpen) L.marker([st.lat, st.lon], {icon: L.divIcon({className:"", html:`<span class="pricetag${sel ? " sel" : ""}">${s.code} $${Math.round(s.min)}</span>`, iconAnchor:[-8, 22]}), zIndexOffset: sel ? 10000 : 0})
      .on("click", () => select(s.code)).addTo(layer);
  }
  L.circleMarker([o.lat, o.lon], {radius:9, color:"#4ade80", weight:3, fillColor:"#ffffff", fillOpacity:1}).bindTooltip(`<b>${esc(o.label)}</b>`, {className:"plain"}).addTo(layer);
  if(!state.fitFor || state.fitFor !== state.origin){ map.fitBounds(pts, {padding:[40,40], maxZoom:6}); state.fitFor = state.origin; }
}

function select(code){
  state.selected = code;
  $("#list").style.display = "none";
  $("#detail").style.display = "block";
  redrawMap();
  showDetail(code);
  $("#detail").scrollIntoView({block:"start"});
}
function closeDetail(){
  state.selected = null;
  $("#detail").style.display = "none";
  $("#list").style.display = "block";
  redrawMap();
  $("#stat").scrollIntoView({block:"nearest"});
}
// Esc goes back to all destinations (checks the panel, which can still be open after the date or airport changes)
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && $("#detail").style.display === "block") closeDetail();
});

function flightRows(flights, closed, o, d, day){
  const nonstopOnly = $("#nonstop").checked;
  const fl = upcoming(flights).filter(f => !nonstopOnly || f.stops === 0)
    .sort((a,b) => (b.gowild - a.gowild) || a.depart.localeCompare(b.depart));
  if(!fl.length) return `<div class="note">No flights listed by Frontier.</div>`;
  const url = frontierUrl(o, d, day);
  let h = `<div class="note">Book opens Frontier's search for this route and date. Sign in there, click the GoWild tab above the flights, then pick the flight with the same time and flight number.</div>
    <div class="tablewrap"><table><tr><th>Depart → Arrive</th><th>Flight</th><th class="num">GoWild</th><th class="num">Regular</th><th></th></tr>`;
  for(const f of fl){
    const via = f.via.length ? `via ${f.via.join(", ")}` : "nonstop";
    const arrNext = f.depart.slice(0,10) !== f.arrive.slice(0,10) ? " <span class='badge'>+1</span>" : "";
    let track = "";
    if(f.gowild && f.first_open) track = `open since ${fmtStamp(f.first_open)}` + (f.price_lo !== f.price_hi ? ` · ${fmtMoney(f.price_lo)}–${fmtMoney(f.price_hi)}` : "");
    h += `<tr class="${f.gowild ? "" : "closed"}">
      <td><b>${fmtTime(f.depart)}</b> → ${fmtTime(f.arrive)}${arrNext}<div class="track">${esc(f.duration || "")}</div></td>
      <td>${esc(f.flight_numbers.join(" + "))}<div class="track">${via}</div></td>
      <td class="num">${f.gowild ? `<b style="color:var(--green)">${fmtMoney(f.gowild_price)}</b>` + (f.gowild_seats_text ? `<div><span class="badge seats">${esc(f.gowild_seats_text.replace("!",""))}</span></div>` : "") + (track ? `<div class="track">${track}</div>` : "") : "—"}</td>
      <td class="num">${fmtMoney(f.standard_price)}</td>
      <td>${f.gowild ? `<a class="book" href="${url}" target="_blank" rel="noopener" title="Pick ${esc(f.flight_numbers.join(" + "))} departing ${fmtTime(f.depart)} on Frontier">Book ↗</a>` : ""}</td></tr>`;
  }
  h += "</table></div>";
  if(closed && closed.length){
    h += `<div class="section"><h3>Seats that closed</h3>` + closed.map(c => `<div class="track">${esc(c.key.split("@")[0])} ${fmtTime(c.key.split("@")[1])} · last seen open ${fmtStamp(c.last_open)}</div>`).join("") + `</div>`;
  }
  return h;
}

async function showDetail(code){
  const st = state.stations[code] || {label: code};
  const o = state.origin, day = state.day;
  const r = state.results.results[code];
  const nextDays = state.meta.days.filter(d => d.date >= day).slice(0, 3);
  let h = `<button class="ghost back" onclick="closeDetail()" aria-keyshortcuts="Escape">← All destinations <kbd>esc</kbd></button>
    <h2>${esc(state.stations[o].city)} → ${esc(st.label)}</h2>
    <div class="note">${fmtDay(day)}${r ? " · checked " + fmtStamp(r.checked_at) : ""} · <a href="${frontierUrl(o, code, day)}" target="_blank" rel="noopener">Open on Frontier ↗</a></div>`;
  if(!r) h += `<div class="section note">Not checked yet. <button class="ghost" onclick="scanOne('${o}','${code}','${day}')">Check this route</button></div>`;
  else if(r.status === "no_service") h += `<div class="section note">Frontier has no flights on this route on ${fmtDay(day)}.</div>`;
  else h += `<div class="section">${flightRows(r.flights, r.closed_since, o, code, day)}</div>`;
  h += `<div class="section"><h3>Return ${esc(st.city || code)} → ${esc(state.stations[o].city)}</h3>
    <div class="row" style="flex-wrap:wrap">${nextDays.map(d => `<button class="ghost" onclick="loadReturn('${code}','${o}','${d.date}', true)">${fmtDay(d.date)}</button>`).join("")}</div>
    <div id="ret" class="section"></div></div>
    <div class="section"><h3>Check history</h3><div id="hist" class="track">loading…</div></div>`;
  $("#detail").innerHTML = h;
  const hist = await api(`/api/history?origin=${o}&dest=${code}&day=${day}`);
  $("#hist").innerHTML = hist.length ? hist.slice(-12).reverse().map(x =>
    `<div>${fmtStamp(x.checked_at)} · ${x.status === "ok" ? (x.n_gowild ? `${x.n_gowild} GoWild, from ${fmtMoney(x.min_gowild)}` : "no GoWild seats") : x.status === "no_service" ? "no service" : "error: " + esc(x.error)}</div>`).join("") : "No checks yet.";
}

async function loadReturn(from, to, day, scanIfMissing){
  const box = $("#ret"); if(!box) return;
  const res = await api(`/api/results?origin=${from}&day=${day}`);
  const r = res.results[to];
  if(!r && scanIfMissing){
    box.innerHTML = `<div class="note">Checking ${from} → ${to} on ${fmtDay(day)}…</div>`;
    const j = await api("/api/scan", {origin: from, day, dests: [to], label: `return ${from}→${to}`});
    await waitJob(j.job.id);
    return loadReturn(from, to, day, false);
  }
  if(!r){ box.innerHTML = `<div class="note">Couldn't check that route.</div>`; return; }
  box.innerHTML = `<div class="note">${fmtDay(day)} · checked ${fmtStamp(r.checked_at)} · <a href="#" onclick="event.preventDefault();rescanReturn('${from}','${to}','${day}')">re-check</a> · <a href="${frontierUrl(from,to,day)}" target="_blank" rel="noopener">Open on Frontier ↗</a></div>` +
    (r.status === "no_service" ? `<div class="note">No flights this day.</div>` : flightRows(r.flights, null, from, to, day));
}
async function rescanReturn(from, to, day){
  $("#ret").innerHTML = `<div class="note">Checking…</div>`;
  const j = await api("/api/scan", {origin: from, day, dests: [to], label: `return ${from}→${to}`});
  await waitJob(j.job.id); loadReturn(from, to, day, false);
}
async function scanOne(o, d, day){
  const j = await api("/api/scan", {origin:o, day, dests:[d]});
  await waitJob(j.job.id); await load();
}
async function waitJob(id){
  for(let i = 0; i < 120; i++){
    const {jobs} = await api("/api/jobs");
    const j = jobs.find(x => x.id === id);
    if(!j || j.state === "done" || j.state === "stopped") return j;
    await new Promise(r => setTimeout(r, 1000));
  }
}

async function scan(){
  $("#scan").disabled = true;
  try{
    const j = await api("/api/scan", {origin: state.origin, day: state.day});
    state.jobId = j.job.id;
  } catch(e){ alertBox(e.message); }
  $("#scan").disabled = false;
}
function alertBox(msg){ $("#daynote").innerHTML = `<div class="warn">${esc(msg)}</div>`; }

let lastRefresh = 0;
async function pollJobs(){
  try{
    const {jobs, cooldown} = await api("/api/jobs");
    const mine = jobs.filter(j => j.origin === state.origin && j.day === state.day && (j.state === "running" || j.state === "queued"));
    const box = $("#jobbox");
    if(mine.length){
      const j = mine[0];
      box.style.display = "block";
      $("#bar").style.width = (j.total ? 100 * j.done / j.total : 0) + "%";
      const left = Math.ceil((j.total - j.done) * 5.5 / 60);
      $("#jobtext").textContent = j.state === "queued" ? "Waiting for another check to finish…" : `Checked ${j.done} of ${j.total} routes · ${j.found} with GoWild seats so far · about ${left} min left (paced so Frontier doesn't block us)`;
      if(Date.now() - lastRefresh > 3000){ lastRefresh = Date.now(); state.results = await api(`/api/results?origin=${state.origin}&day=${state.day}`); render(); }
      state.wasRunning = true;
    } else {
      const stopped = jobs.filter(j => j.origin === state.origin && j.state === "stopped").pop();
      box.style.display = stopped ? "block" : "none";
      if(stopped) $("#jobtext").textContent = stopped.message;
      if(state.wasRunning){ state.wasRunning = false; await load(); }
    }
    if(cooldown){
      $("#scan").disabled = true;
      $("#scan").textContent = `Frontier paused us · retry in ${Math.ceil(cooldown/60)} min`;
    } else if($("#scan").disabled && !state.scanning){ $("#scan").disabled = false; render(); }
  } catch(e){}
  setTimeout(pollJobs, 1200);
}

setInterval(() => { if(state.results && !state.selected) render(); }, 60000);   // drop flights as they depart
init().catch(e => alertBox("Couldn't start: " + e.message));
</script>
</body>
